<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo Tierras Gosén</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen/Control.FullScreen.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    
<div class="container">
    <button id="toggle-sidebar" class="toggle-flotante">☰</button>
    <aside class="sidebar">
        <h2>Puntos de interés</h2>

        <div class="buscador-wrapper">
            <span class="buscador-icono">🔍</span>
            <input  
                type="text" 
                id="buscador-puntos" 
                placeholder="Buscar punto de interés..."
            >
        </div>

        <h3>Filtrar por categoría</h3>

        <div class="filtros">
            <button class="filtro-btn activo" data-categoria="todos">Todos</button>
            <button class="filtro-btn" data-categoria="alojamiento">Alojamiento</button>
            <button class="filtro-btn" data-categoria="educativo">Educativo</button>
            <button class="filtro-btn" data-categoria="mirador">Mirador</button>
            <button class="filtro-btn" data-categoria="sendero">Senderos</button>
            <button class="filtro-btn" data-categoria="experiencia">Experiencias</button>
        </div>

        <ul id="lista-puntos"></ul>
    </aside>

    <main class="map-container">
        <h1>Mapa Interactivo Tierras Gosén</h1>
        <div id="map"></div>
    </main>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.fullscreen/Control.FullScreen.js"></script>
<script src="map.js"></script>
    
</body>
</html>
